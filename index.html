<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EcoRuta - Sitio Estático</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 2rem;
        background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
        color: #ffffff;
        text-align: center;
      }
      .card {
        max-width: 600px;
        padding: 2.5rem;
        border-radius: 16px;
        background: rgba(0, 0, 0, 0.35);
        border: 1px solid rgba(255, 255, 255, 0.2);
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
      }
      h1 { color: #a7f3d0; margin-bottom: 1rem; font-size: 2.2rem; }
      p { margin-bottom: 2rem; line-height: 1.6; opacity: 0.95; }
      nav a {
        display: inline-block;
        padding: 12px 28px;
        border-radius: 8px;
        background-color: #0E7C7B;
        color: #ffffff;
        font-weight: bold;
        text-decoration: none;
      }
      nav a:hover { background-color: #0b6160; }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>EcoRuta Temuco</h1>
      <p>
        Descubre los mejores senderos sostenibles y conecta con los emprendimientos
        locales de La Araucanía.
      </p>
      <nav aria-label="Acceso a la aplicación">
        <a href="./aplicacion/">Aplicación</a>
      </nav>
    </main>
  </body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>  
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wireframe Básico 1 — esqueleto</title>
<link rel="stylesheet" href="06_starter.css">
</head>
<body>

  <!-- 1: Cabecera principal -->
  <!-- Al tener 3 elementos directos y justify-content: space-between, se irán a los extremos y al centro -->
  <header>
      <!-- Elemento Izquierdo: Icono de menú hamburguesa -->
      <div class="menu-icon">
          <span>≡</span>
      </div>

      <!-- Elemento Central: Navegación -->
      <nav>
          <button>Opción 1</button>
          <button>Opción 2</button>
          <button>Opción 3</button>
      </nav>
      
      <!-- Elemento Derecho: Área de perfil y notificaciones -->
      <div class="user-info">
          <span class="bell">Campana</span>
          <span class="avatar">Usuario</span>
      </div>
  </header>
    
  <!-- 3: Barra secundaria que contiene un botón solitario -->
  <section>
      <button>Acción principal</button>
  </section>

  <!-- 4: Contenido principal -->
  <!-- starter.css convierte a <main> en un grid, por ende los <article> deben ir DIRECTAMENTE aquí adentro -->
  <main>
      
      <!-- 5: tarjeta independiente (elemento 1 de la grilla) -->
      <article>
          <img src="https://placehold.co/320x240?text=Tarjeta+1" alt="Fondo gris">
          <button class="card-action">Acción</button>
      </article>
      
      <!-- 6: tarjeta independiente (elemento 2 de la grilla) -->
      <article>
          <img src="https://placehold.co/320x240?text=Tarjeta+2" alt="Fondo gris">
          <button class="card-action">Acción</button>
      </article>

      <!-- 7: tarjeta independiente (elemento 3 de la grilla) -->
      <article>
          <img src="https://placehold.co/320x240?text=Tarjeta+3" alt="Fondo gris">
          <button class="card-action">Acción</button>
      </article>

      <!-- 8: tarjeta independiente (elemento 4 de la grilla) -->
      <article>
          <img src="https://placehold.co/320x240?text=Tarjeta+4" alt="Fondo gris">
          <button class="card-action">Acción</button>
      </article>

      <!-- 9: tarjeta independiente (elemento 5 de la grilla) -->
      <article>
          <img src="https://placehold.co/320x240?text=Tarjeta+5" alt="Fondo gris">
          <button class="card-action">Acción</button>
      </article>

      <!-- 10: tarjeta independiente (elemento 6 de la grilla) -->
      <article>
          <img src="https://placehold.co/320x240?text=Tarjeta+6" alt="Fondo gris">
          <button class="card-action">Acción</button>
      </article>

  </main>

</body>
</html>
</body>
</html>
